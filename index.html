<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Utilities Game Library</title>
	<style>
		:root { color-scheme: dark; --ink: #f6f2e8; --muted: #b9b4a7; --accent: #f0b35b; --panel: #252b35; --line: #424b58; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; color: var(--ink); font: 16px/1.5 Georgia, serif; background: radial-gradient(circle at 20% 0%, #3d4e55, transparent 42%), #171b22; }
		main { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 72px 0; }
		.eyebrow { color: var(--accent); letter-spacing: .16em; text-transform: uppercase; font: 700 12px/1.2 Arial, sans-serif; }
		h1 { max-width: 640px; margin: 12px 0 10px; font-size: clamp(42px, 8vw, 78px); line-height: .96; }
		.intro { max-width: 600px; color: var(--muted); font-size: 19px; }
		.actions, .game-actions { display: flex; flex-wrap: wrap; gap: 10px; }
		.actions { margin: 28px 0 64px; }
		.upload-button { display: inline-block; }
		.upload-button span { align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; display: inline-flex; font: 700 14px Arial, sans-serif; height: 42px; padding: 0 16px; }
		.upload-button span:hover { border-color: var(--accent); }
		.upload-button input { display: none; }
		a, button { border: 1px solid var(--line); border-radius: 4px; cursor: pointer; color: var(--ink); font: 700 14px Arial, sans-serif; text-decoration: none; }
		.actions > a { align-items: center; display: inline-flex; height: 42px; padding: 0 16px; }
		.actions a.primary { border-color: var(--accent); background: var(--accent); color: #201a12; }
		button:hover, a:hover { border-color: var(--accent); }
		h2 { margin: 0 0 16px; font-size: 28px; }
		#pinned-games { display: grid; gap: 12px; }
		.tab-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
		.tab { background: transparent; color: var(--muted); padding: 10px 14px; }
		.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #201a12; }
		.tab-panel[hidden] { display: none; }
		.tab-panel { display: grid; gap: 12px; }
		.game { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 20px; border-top: 1px solid var(--line); }
		.game strong { display: block; font-size: 19px; }
		.game small { color: var(--muted); }
		.game-actions button { width: 36px; height: 36px; padding: 4px 9px; font-size: 18px; }
		.game-actions button svg { height: 18px; width: 18px; }
		.game-actions .play-button { width: auto; height: auto; padding: 8px 12px; font-size: 12px; }
		.empty { padding: 28px 0; color: var(--muted); border-top: 1px solid var(--line); }
		#status { min-height: 24px; margin: 12px 0; color: var(--accent); font: 13px Arial, sans-serif; }
		@media (max-width: 600px) { main { padding: 42px 0; } .game { align-items: flex-start; flex-direction: column; gap: 12px; } }
	</style>
</head>
<body>
	<main>
		<div class="eyebrow">Personal game shelf</div>
		<h1>Pick up where you left off.</h1>
		<p class="intro">Pin games from the full library, save them for offline play, or download a copy to keep.</p>
		<div class="actions">
			<a class="primary" href="AllFIles.html">Browse all games</a>
			<label class="upload-button"><span class="actions a">Upload HTML game</span><input id="upload-game" type="file" accept=".html,text/html"></label>
			<a href="https://github.com/DennisA-byte/Utilities/archive/refs/heads/main.zip" download>Download source code</a>
		</div>
		<section aria-labelledby="pinned-heading">
			<h2 id="pinned-heading">Your games</h2>
			<div id="status" role="status"></div>
			<div class="tab-list" role="tablist" aria-label="Game collections">
				<button class="tab" role="tab" aria-selected="true" data-tab="pinned">Pinned</button>
				<button class="tab" role="tab" aria-selected="false" data-tab="recent">Recently played</button>
				<button class="tab" role="tab" aria-selected="false" data-tab="offline">Offline</button>
				<button class="tab" role="tab" aria-selected="false" data-tab="my-games">My games</button>
			</div>
			<div id="game-panel" class="tab-panel"></div>
		</section>
	</main>
	<script src="game-storage.js"></script>
	<script>
		const gamePanel = document.getElementById("game-panel");
		const status = document.getElementById("status");
		let activeTab = "pinned";

		function showStatus(message) {
			status.textContent = message;
			window.setTimeout(() => { status.textContent = ""; }, 3000);
		}

		function makeGameCard(gameInfo) {
				const card = document.createElement("article");
				card.className = "game";
				card.tabIndex = 0;
				card.setAttribute("role", "button");
				card.setAttribute("aria-label", `Play ${gameInfo.title}`);
				card.onclick = () => run(() => GameLibrary.play(gameInfo.file));
				card.onkeydown = (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); card.click(); } };
				const title = document.createElement("strong");
				title.textContent = gameInfo.title;
				const meta = document.createElement("small");
				meta.textContent = gameInfo.source === "upload" ? "Uploaded to this browser" : "Ready in your shelf";
				const copy = document.createElement("div");
				copy.append(title, meta);
				const actions = document.createElement("div");
				actions.className = "game-actions";
				const play = document.createElement("button");
				play.className = "play-button";
				play.textContent = "Play";
				play.onclick = () => run(() => GameLibrary.play(gameInfo.file));
				const download = document.createElement("button");
				download.innerHTML = GameLibrary.icon("download");
				download.title = "Download";
				download.setAttribute("aria-label", `Download ${gameInfo.title}`);
				download.onclick = () => run(() => GameLibrary.download(gameInfo.file));
				const offline = document.createElement("button");
				offline.innerHTML = GameLibrary.icon("offline");
				offline.title = "Save offline";
				offline.setAttribute("aria-label", `Save ${gameInfo.title} offline`);
				offline.onclick = () => run(async () => { await GameLibrary.saveOffline(gameInfo.file); showStatus(`${gameInfo.title} is saved offline.`); await renderTab(); });
				const pin = document.createElement("button");
				pin.innerHTML = GameLibrary.icon("pin");
				pin.title = GameLibrary.isPinned(gameInfo.file) ? "Unpin" : "Pin";
				pin.setAttribute("aria-label", pin.title);
				pin.onclick = () => run(async () => { GameLibrary.togglePinned(gameInfo.file); await renderTab(); });
				actions.onclick = (event) => event.stopPropagation();
				actions.append(play, download, offline, pin);
				card.append(copy, actions);
				return card;
		}

		async function renderTab() {
			const saved = (await GameLibrary.getSavedGames()).map((game) => ({ ...game, title: game.title || game.file, source: game.source || "offline" }));
			const savedByFile = new Map(saved.map((game) => [game.file, game]));
			const toGame = (file) => savedByFile.get(file) || { file, title: file, source: "library" };
			const pinned = GameLibrary.getPinned().map(toGame);
			const recent = GameLibrary.getRecent().map(toGame);
			const myGames = saved.filter((game) => game.source === "upload");
			const selected = { pinned, recent, offline: saved, "my-games": myGames }[activeTab];
			gamePanel.replaceChildren();
			if (!selected.length) {
				gamePanel.innerHTML = `<div class="empty">No ${activeTab.replace("-", " ")} games yet.</div>`;
				return;
			}
			selected.forEach((game) => gamePanel.appendChild(makeGameCard(game)));
		}

		async function run(action) {
			try { await action(); } catch (error) { showStatus(error.message); }
		}

		document.querySelectorAll("[data-tab]").forEach((tab) => tab.addEventListener("click", async () => {
			activeTab = tab.dataset.tab;
			document.querySelectorAll("[data-tab]").forEach((item) => item.setAttribute("aria-selected", item === tab));
			await renderTab();
		}));
		document.getElementById("upload-game").addEventListener("change", async (event) => {
			try {
				const id = await GameLibrary.importGame(event.target.files[0]);
				showStatus("Game saved to My games and opened.");
				await GameLibrary.play(id);
				activeTab = "my-games";
				document.querySelector('[data-tab="my-games"]').click();
			} catch (error) { showStatus(error.message); }
			event.target.value = "";
		});
		renderTab();
	</script>
</body>
</html>
