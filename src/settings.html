<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Utilities Settings</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6f2e8;
      --muted: #b9b4a7;
      --accent: #f0b35b;
      --panel: #252b35;
      --line: #424b58;
      --sidebar: #1a1f28;
      --soft: #1f2631;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #171b22;
      color: var(--ink);
      font: 16px/1.5 Georgia, serif;
    }

    .settings-shell {
      display: grid;
      grid-template-columns: minmax(220px, 260px) 1fr;
      min-height: 100vh;
    }

    .settings-sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      padding: 28px 18px;
    }

    .settings-header {
      align-items: center;
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    .settings-header h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
    }

    .settings-nav {
      display: grid;
      gap: 8px;
    }

    .settings-nav .nav-back {
      align-items: center;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      font-size: 26px;
      height: 42px;
      justify-content: center;
      padding: 0;
      width: 42px;
    }

    .settings-nav button,
    .settings-nav a,
    .settings-panel a,
    .settings-panel button {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font: 700 14px Arial, sans-serif;
      text-decoration: none;
    }

    .settings-nav button,
    .settings-nav a {
      align-items: center;
      background: var(--soft);
      display: flex;
      justify-content: flex-start;
      padding: 10px 12px;
      text-align: left;
      width: 100%;
    }

    .settings-nav button[aria-selected="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #201a12;
    }

    .settings-content {
      padding: 40px 32px;
    }

    .settings-panel {
      display: none;
      max-width: 760px;
    }

    .settings-panel.active {
      display: block;
    }

    .settings-panel h2 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.1;
    }

    .settings-panel p {
      color: var(--muted);
      margin: 0 0 20px;
    }

    .settings-actions {
      display: grid;
      gap: 12px;
      max-width: 420px;
    }

    .settings-panel a,
    .settings-panel button {
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 46px;
      padding: 11px 14px;
      width: 100%;
    }

    .settings-panel [hidden] {
      display: none;
    }

    .settings-panel button[disabled],
    .settings-panel a[aria-disabled="true"] {
      opacity: 0.65;
      cursor: not-allowed;
      pointer-events: none;
    }

    .settings-panel a.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #201a12;
    }

    .settings-panel .hint {
      color: var(--muted);
      font-size: 14px;
      margin-top: 8px;
    }

    .settings-home {
      margin-top: 20px;
    }

    @media (max-width: 700px) {
      .settings-shell {
        grid-template-columns: 1fr;
      }

      .settings-sidebar {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }

      .settings-content {
        padding: 24px 18px 40px;
      }
    }
  </style>
</head>
<body>
  <div class="settings-shell">
    <aside class="settings-sidebar" aria-label="Settings sections">
      <div class="settings-header">
        <button class="nav-back" type="button" aria-label="Back to game library" title="Back to game library">←</button>
        <h1>Settings</h1>
      </div>
      <nav class="settings-nav" aria-label="Settings sections">
        <button type="button" data-panel="general" aria-selected="true">General</button>
        <button type="button" data-panel="source" aria-selected="false">Source &amp; downloads</button>
        <a href="backups.html">Backups</a>
      </nav>
    </aside>

    <main class="settings-content">
      <section class="settings-panel active" id="general-panel" aria-label="General settings">
        <h2>General</h2>
        <p>Application settings will live here as the project grows.</p>
      </section>

      <section class="settings-panel" id="source-panel" aria-label="Source and downloads settings">
        <h2>Source &amp; downloads</h2>
        <p>Download the project source, review the repository, or create a standalone app bundle.</p>
        <div class="settings-actions">
          <a href="https://github.com/DennisA-byte/Utilities/archive/refs/heads/main.zip" download>Download source code</a>
          <a href="https://github.com/DennisA-byte/Utilities" target="_blank" rel="noopener noreferrer">View source repository</a>
          <a id="compile-open" href="#" target="_blank" rel="noopener">Open compiled app</a>
          <button id="compile-download" type="button">Download compiled app</button>
          <button id="compile-copy-data-url" type="button">Copy standalone data URL</button>
        </div>
        <p class="hint" id="settings-status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script>
    const navButtons = [...document.querySelectorAll(".settings-nav button[data-panel]")];
    const backButton = document.querySelector(".nav-back");
    const panels = {
      general: document.getElementById("general-panel"),
      source: document.getElementById("source-panel"),
    };

    backButton.addEventListener("click", () => {
      window.location.href = "index.html";
    });

    function showPanel(panelName) {
      navButtons.forEach((button) => {
        const active = button.dataset.panel === panelName;
        button.setAttribute("aria-selected", String(active));
      });

      Object.entries(panels).forEach(([name, panel]) => {
        panel.classList.toggle("active", name === panelName);
      });
    }

    navButtons.forEach((button) => {
      button.addEventListener("click", () => showPanel(button.dataset.panel));
    });

    function setStatus(message = "") {
      const status = document.getElementById("settings-status");
      status.textContent = message;
    }

    function inlineScript(html, source, contents) {
      const encoded = btoa(unescape(encodeURIComponent(contents)));
      const closingScript = "<" + "/script>";
      const bootstrap = `<script>window.__utilitiesRunningSource=decodeURIComponent(escape(atob("${encoded}")));eval(window.__utilitiesRunningSource)${closingScript}`;
      return html.replace(`<script src="${source}">${closingScript}`, bootstrap);
    }

    function toDataUrl(html) {
      const encoded = btoa(unescape(encodeURIComponent(html)));
      return `data:text/html;charset=utf-8;base64,${encoded}`;
    }

    async function compileApplication() {
      const responseFor = (path) => fetch(path).then((response) => {
        if (!response.ok) throw new Error(`Could not read ${path}`);
        return response.text();
      });

      const [indexSource, allFilesSource, filesSource, storageSource, notificationsSource, settingsSource, backupsPageSource, backupsScriptSource] = await Promise.all([
        responseFor("index.html"),
        responseFor("AllFIles.html"),
        responseFor("files.js"),
        responseFor("game-storage.js"),
        responseFor("notifications.js"),
        responseFor("settings.html"),
        responseFor("backups.html"),
        responseFor("backups.js"),
      ]);

      let compiledLibrary = inlineScript(allFilesSource, "files.js", filesSource);
      compiledLibrary = inlineScript(compiledLibrary, "game-storage.js", storageSource);
      compiledLibrary = inlineScript(compiledLibrary, "notifications.js", notificationsSource);
      const librarySourcePayload = btoa(unescape(encodeURIComponent(allFilesSource)));
      compiledLibrary = compiledLibrary.replace("<head>", `<head><meta name="utilities-running-source" content="${librarySourcePayload}">`);
      compiledLibrary = compiledLibrary.replace('href="index.html"', 'href="javascript:history.back()"');

      let compiledApp = inlineScript(indexSource, "game-storage.js", storageSource);
      compiledApp = inlineScript(compiledApp, "notifications.js", notificationsSource);
      const appSourcePayload = btoa(unescape(encodeURIComponent(indexSource)));
      compiledApp = compiledApp.replace("<head>", `<head><meta name="utilities-running-source" content="${appSourcePayload}">`);

      const libraryPayload = btoa(unescape(encodeURIComponent(compiledLibrary)));
      const libraryScript = `<script>const embeddedLibrary = "${libraryPayload}";function openEmbeddedLibrary(event){event.preventDefault();const popup=window.open("about:blank","_blank");if(!popup){document.getElementById("status").textContent="Allow pop-ups to browse all games.";return false;}popup.document.open();popup.document.write(decodeURIComponent(escape(atob(embeddedLibrary))));popup.document.close();return false;}</` + "script>";
      compiledApp = compiledApp.replace('href="AllFIles.html"', 'href="#embedded-library" onclick="return openEmbeddedLibrary(event)"');
      compiledApp = compiledApp.replace('window.location.href = "settings.html";', "openEmbeddedSettings();");
      const embeddedSettingsSource = settingsSource.replace(
        'window.location.href = "index.html";',
        'window.parent.postMessage("utilities-close-settings", "*");',
      ).replace('href="backups.html"', 'href="#backups" onclick="window.parent.openEmbeddedBackups();return false"');
      const settingsPayload = btoa(unescape(encodeURIComponent(embeddedSettingsSource)));
      let compiledBackups = inlineScript(backupsPageSource, "files.js", filesSource);
      compiledBackups = inlineScript(compiledBackups, "game-storage.js", storageSource);
      compiledBackups = inlineScript(compiledBackups, "backups.js", backupsScriptSource);
      const sourceFilesPayload = btoa(unescape(encodeURIComponent(JSON.stringify({
        "index.html": indexSource,
        "AllFIles.html": allFilesSource,
        "files.js": filesSource,
        "game-storage.js": storageSource,
        "notifications.js": notificationsSource,
        "settings.html": settingsSource,
        "backups.html": backupsPageSource,
        "backups.js": backupsScriptSource,
      }))));
      compiledBackups = compiledBackups.replace("<head>", `<head><meta name="utilities-source-files" content="${sourceFilesPayload}">`);
      compiledBackups = compiledBackups.replace('href="settings.html"', 'href="#settings" onclick="window.parent.returnToEmbeddedSettings();return false"');
      const backupsPayload = btoa(unescape(encodeURIComponent(compiledBackups)));
      const closingBody = "<" + "/body>";
      const settingsScript = `<script>
        const embeddedSettings = "${settingsPayload}";
        const embeddedBackups = "${backupsPayload}";
        let settingsFrame;
        let backupsFrame;
        document.querySelectorAll("#settings-button, .browse-link").forEach((action) => {
          action.classList.remove("network-action");
          action.removeAttribute("aria-disabled");
          if ("disabled" in action) action.disabled = false;
          action.tabIndex = 0;
        });
        function openEmbeddedSettings() {
          if (settingsFrame) return;
          settingsFrame = document.createElement("iframe");
          settingsFrame.title = "Settings";
          settingsFrame.style.cssText = "border:0;position:fixed;inset:0;width:100%;height:100%;z-index:2147483647";
          settingsFrame.srcdoc = decodeURIComponent(escape(atob(embeddedSettings)));
          document.body.appendChild(settingsFrame);
        }
        function openEmbeddedBackups() {
          if (settingsFrame) {
            settingsFrame.remove();
            settingsFrame = null;
          }
          if (backupsFrame) return;
          backupsFrame = document.createElement("iframe");
          backupsFrame.title = "Backups";
          backupsFrame.style.cssText = "border:0;position:fixed;inset:0;width:100%;height:100%;z-index:2147483647";
          backupsFrame.srcdoc = decodeURIComponent(escape(atob(embeddedBackups)));
          document.body.appendChild(backupsFrame);
        }
        function returnToEmbeddedSettings() {
          if (backupsFrame) {
            backupsFrame.remove();
            backupsFrame = null;
          }
          openEmbeddedSettings();
        }
        window.openEmbeddedBackups = openEmbeddedBackups;
        window.returnToEmbeddedSettings = returnToEmbeddedSettings;
        window.addEventListener("message", (event) => {
          if (settingsFrame && event.source === settingsFrame.contentWindow && event.data === "utilities-close-settings") {
            settingsFrame.remove();
            settingsFrame = null;
          }
          if (settingsFrame && event.source === settingsFrame.contentWindow && event.data === "utilities-open-backups") openEmbeddedBackups();
          if (backupsFrame && event.source === backupsFrame.contentWindow && event.data === "utilities-back-to-settings") returnToEmbeddedSettings();
        });
      </` + "script>";
      compiledApp = compiledApp.replace(closingBody, `${libraryScript}${settingsScript}${closingBody}`);
      return compiledApp;
    }

    let compiledAppOpenUrl = "";
    const compilationButtons = [
      document.getElementById("compile-download"),
      document.getElementById("compile-open"),
      document.getElementById("compile-copy-data-url"),
    ];
    const compilationLabels = new Map([
      [document.getElementById("compile-download"), "Download compiled app"],
      [document.getElementById("compile-open"), "Open compiled app"],
      [document.getElementById("compile-copy-data-url"), "Copy standalone data URL"],
    ]);

    function setCompilationLoading(loading, label = "Preparing app...") {
      compilationButtons.forEach((button) => {
        button.disabled = loading;
        button.setAttribute("aria-disabled", loading);
        button.textContent = loading ? label : compilationLabels.get(button);
      });
    }

    let compilationReady = Promise.resolve("");
    if (window.parent === window) {
      setCompilationLoading(true);
      compilationReady = compileApplication().then((compiledApp) => {
        compiledAppOpenUrl = URL.createObjectURL(new Blob([compiledApp], { type: "text/html" }));
        const openLink = document.getElementById("compile-open");
        openLink.href = compiledAppOpenUrl;
        openLink.removeAttribute("aria-disabled");
        setCompilationLoading(false);
        return compiledApp;
      }).finally(() => {
        setCompilationLoading(false);
      });
    } else {
      compilationButtons.forEach((button) => { button.hidden = true; });
    }

    async function runCompilation(mode) {
      if (mode === "open") return;
      setCompilationLoading(true, "Downloading...");
      setStatus("Compiling app...");
      try {
        if (mode === "open") throw new Error("Compiled app is still preparing. Try again in a moment.");
        const compiledApp = await compilationReady;
        const link = document.createElement("a");
        link.href = toDataUrl(compiledApp);
        link.download = "utilities-compiled.html";
        link.click();
        setStatus("Compiled app downloaded.");
      } catch (error) {
        setStatus(error.message);
      } finally {
        setCompilationLoading(false);
      }
    }

    document.getElementById("compile-download").addEventListener("click", () => runCompilation("download"));
    document.getElementById("compile-copy-data-url").addEventListener("click", async () => {
      setCompilationLoading(true, "Preparing data URL...");
      setStatus("Compiling standalone app...");
      try {
        const compiledApp = await compilationReady;
        await navigator.clipboard.writeText(toDataUrl(compiledApp));
        setStatus("Copied. Paste into a browser address bar to open; data URLs cannot access browser storage. Download the app for saved data.");
      } catch (error) {
        setStatus(`Could not copy the standalone data URL: ${error.message}`);
      } finally {
        setCompilationLoading(false);
      }
    });
    document.getElementById("compile-open").addEventListener("click", (event) => {
      if (!compiledAppOpenUrl) {
        event.preventDefault();
        setStatus("Compiled app is still preparing. Try again in a moment.");
      }
    });
  </script>
</body>
</html>
